name: Validate static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Root layer: data -> pages
      - name: Rebuild the root layer from source data
        run: npm run build

      - name: Fail if root pages are out of date with the evidence file
        run: git diff --exit-code -- data index.html category entry review.html sources.html playbook.html

      # Atlas subsite: data -> pages (scripts/build.mjs writes only atlas/** and data/atlas-entries.json)
      - name: Rebuild the verified atlas subsite
        run: node scripts/build.mjs

      - name: Fail if the atlas pages are stale
        run: git diff --exit-code -- atlas data/atlas-entries.json

      - name: Validation gate (root layer)
        run: node tests/validate.mjs

      - name: Interactive render test (headless DOM)
        run: node tests/dom.test.mjs

      - name: Validation gate (atlas layer, plus a whole-repository link audit)
        run: node tests/validate-atlas.mjs
