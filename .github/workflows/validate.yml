name: Validate site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data and built site
        run: node tests/validate.mjs
      - name: Check committed pages match the data
        run: |
          node tools/build.mjs
          if [ -n "$(git status --porcelain -- index.html analysis.html methodology.html review.html category)" ]; then
            echo "::error::Committed pages are out of date. Run 'node tools/build.mjs' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
      - name: Validate supplemental research page
        run: python3 supplemental/check.py
      - name: Verify mobile layout assumptions
        run: |
          grep -q "@media (max-width: 760px)" assets/style.css
          ! grep -rqE "min-width: *[6-9][0-9][0-9]px" index.html category review.html analysis.html methodology.html

      # The /atlas subsite is written by scripts/build-atlas.mjs from data/atlas-*.json only.
      - name: Atlas subsite is up to date
        run: |
          node scripts/build-atlas.mjs
          git diff --exit-code -- atlas data/atlas-entries.json

      # Atlas evidence policy plus a link audit covering every HTML file in the repository.
      - name: Validate the atlas subsite
        run: node tests/validate-atlas.mjs
