name: Validate static site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Rebuild every page from the pinned data, then run the gates.
      - name: Rebuild site from data
        run: npm run build

      # No build output may differ from what is committed: catches hand-edited HTML.
      - name: Generated site is current
        run: git diff --exit-code --stat

      - name: Validate merged dataset and published pages
        run: node tests/validate.mjs

      - name: Validate the archived Prize Atlas build (parallel sessions)
        run: node tests/validate-prize-atlas.mjs

      - name: Check every internal link and anchor
        run: node scripts/checklinks.js

      # The /atlas subsite is written by scripts/build-atlas.mjs from data/atlas-*.json only.
      - name: Atlas subsite is up to date
        run: |
          node scripts/build-atlas.mjs
          git diff --exit-code -- atlas data/atlas-entries.json

      # Atlas evidence policy plus an internal-link audit of every page in the repository.
      - name: Validate the atlas subsite
        run: node tests/validate-atlas.mjs
