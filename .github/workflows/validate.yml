name: Validate static site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Rebuild every page from the pinned data, then run the gates.
      - name: Rebuild site from data
        run: npm run build

      # No build output may differ from what is committed: catches hand-edited HTML.
      - name: Generated site is current
        run: git diff --exit-code --stat

      - name: Validate merged dataset and published pages
        run: node tests/validate.mjs

      - name: Validate the archived Prize Atlas build (parallel sessions)
        run: node tests/validate-prize-atlas.mjs

      - name: Check every internal link and anchor
        run: node scripts/checklinks.js
