name: Validate static site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild every page from source data
        run: npm run build
      - name: Fail if generated pages are out of date with the evidence file
        run: git diff --exit-code -- data index.html category entry review.html sources.html playbook.html
      - name: Verification gate (no unsourced values, no broken local links)
        run: node tests/validate.mjs
      - name: Interactive render test (headless DOM)
        run: node tests/dom.test.mjs

      # The /atlas subsite is written by scripts/build-atlas.mjs from data/atlas-*.json only.
      - name: Atlas subsite is up to date
        run: |
          node scripts/build-atlas.mjs
          git diff --exit-code -- atlas data/atlas-entries.json

      # Atlas evidence policy plus a link audit covering every HTML file in the repository.
      - name: Validate the atlas subsite
        run: node tests/validate-atlas.mjs
