name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Atlas layer (/atlas) is generated from data/*.json; committed HTML must match the data.
      - name: Rebuild the Atlas layer
        run: node scripts/build.mjs

      - name: Fail if the committed Atlas HTML is stale
        run: |
          if [ -n "$(git status --porcelain atlas data/atlas-entries.json)" ]; then
            echo "::error::Atlas pages are out of date. Run 'node scripts/build.mjs' and commit the result."
            git --no-pager diff --stat -- atlas data/atlas-entries.json
            exit 1
          fi

      - name: Validate the Atlas layer (data, evidence standard, every internal link)
        run: node tests/validate-atlas.mjs

      - name: Validate the remaining site layers
        run: node tests/validate.mjs
